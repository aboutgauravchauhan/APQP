spring:
  application:
    name: apqp-management-system

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/apqp_db}
    username: ${DB_USERNAME:apqp_user}
    password: ${DB_PASSWORD:apqp_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          batch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:apqp-super-secret-key-change-in-production-minimum-256-bits}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days

# AWS S3 Configuration
aws:
  s3:
    bucket: ${S3_BUCKET:apqp-documents}
    region: ${AWS_REGION:ap-south-1}
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
    endpoint: ${S3_ENDPOINT:}  # For MinIO or local S3 compatible

# Application Configuration
app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  upload:
    max-file-size: 50MB
    allowed-types: pdf,doc,docx,xls,xlsx,ppt,pptx,dwg,dxf,stp,igs,png,jpg,jpeg
  pagination:
    default-page-size: 20
    max-page-size: 100

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.apqp: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
